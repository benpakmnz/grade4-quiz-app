<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בדיקת LocalStorage</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            text-align: center;
        }
        .section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        button {
            padding: 12px 24px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-test {
            background: #667eea;
            color: white;
        }
        .btn-test:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-clear {
            background: #ef4444;
            color: white;
        }
        .btn-clear:hover {
            background: #dc2626;
        }
        .btn-reload {
            background: #10b981;
            color: white;
        }
        .btn-reload:hover {
            background: #059669;
        }
        pre {
            background: #1f2937;
            color: #10b981;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            direction: ltr;
            text-align: left;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
        }
        .status.success {
            background: #d1fae5;
            color: #065f46;
        }
        .status.error {
            background: #fee2e2;
            color: #991b1b;
        }
        .status.warning {
            background: #fef3c7;
            color: #92400e;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 בדיקת LocalStorage</h1>
        
        <div class="section">
            <h2>מצב הדפדפן</h2>
            <div id="browserStatus"></div>
        </div>

        <div class="section">
            <h2>פעולות</h2>
            <button class="btn-test" onclick="testWrite()">✍️ בדיקת כתיבה</button>
            <button class="btn-test" onclick="testRead()">📖 בדיקת קריאה</button>
            <button class="btn-test" onclick="showAll()">📋 הצג הכל</button>
            <button class="btn-clear" onclick="clearQuizData()">🗑️ נקה נתוני Quiz</button>
            <button class="btn-clear" onclick="clearAll()">⚠️ נקה הכל</button>
            <button class="btn-reload" onclick="location.reload()">🔄 רענן דף</button>
        </div>

        <div class="section">
            <h2>תוצאות</h2>
            <div id="results"></div>
        </div>

        <div class="section">
            <h2>נתוני Quiz נוכחיים</h2>
            <pre id="quizData"></pre>
        </div>
    </div>

    <script>
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.textContent = message;
            results.appendChild(div);
            console.log(message);
        }

        function checkBrowserSupport() {
            const statusDiv = document.getElementById('browserStatus');
            
            if (typeof(Storage) === "undefined") {
                statusDiv.innerHTML = '<div class="status error">❌ הדפדפן לא תומך ב-localStorage!</div>';
                return false;
            }
            
            try {
                localStorage.setItem('test', 'test');
                localStorage.removeItem('test');
                statusDiv.innerHTML = '<div class="status success">✅ localStorage פועל תקין</div>';
                return true;
            } catch (e) {
                statusDiv.innerHTML = `<div class="status error">❌ שגיאה: ${e.message}</div>`;
                return false;
            }
        }

        function testWrite() {
            document.getElementById('results').innerHTML = '';
            log('מתחיל בדיקת כתיבה...', 'info');
            
            try {
                const testData = {
                    score: 100,
                    questionCount: 50,
                    timestamp: new Date().toISOString()
                };
                
                localStorage.setItem('test_score', '100');
                localStorage.setItem('test_data', JSON.stringify(testData));
                
                log('✅ כתיבה הצליחה!', 'success');
                log(`נשמר: test_score = 100`, 'success');
                log(`נשמר: test_data = ${JSON.stringify(testData)}`, 'success');
            } catch (e) {
                log(`❌ שגיאה בכתיבה: ${e.message}`, 'error');
            }
        }

        function testRead() {
            document.getElementById('results').innerHTML = '';
            log('מתחיל בדיקת קריאה...', 'info');
            
            try {
                const score = localStorage.getItem('test_score');
                const data = localStorage.getItem('test_data');
                
                if (score) {
                    log(`✅ נקרא: test_score = ${score}`, 'success');
                } else {
                    log('⚠️ test_score לא נמצא (הרץ קודם "בדיקת כתיבה")', 'warning');
                }
                
                if (data) {
                    log(`✅ נקרא: test_data = ${data}`, 'success');
                } else {
                    log('⚠️ test_data לא נמצא', 'warning');
                }
            } catch (e) {
                log(`❌ שגיאה בקריאה: ${e.message}`, 'error');
            }
        }

        function showAll() {
            document.getElementById('results').innerHTML = '';
            log('מציג את כל המפתחות ב-localStorage:', 'info');
            
            if (localStorage.length === 0) {
                log('⚠️ localStorage ריק!', 'warning');
                return;
            }
            
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const value = localStorage.getItem(key);
                const preview = value.length > 100 ? value.substring(0, 100) + '...' : value;
                log(`${key}: ${preview}`, 'info');
            }
            
            log(`סה"כ ${localStorage.length} פריטים`, 'success');
        }

        function clearQuizData() {
            if (!confirm('האם אתה בטוח שברצונך למחוק את כל נתוני Quiz?')) {
                return;
            }
            
            document.getElementById('results').innerHTML = '';
            log('מוחק נתוני Quiz...', 'info');
            
            const quizKeys = [
                'quiz_score',
                'quiz_streak',
                'quiz_questionCount',
                'quiz_userData',
                'quiz_history',
                'quiz_categoryStats',
                'quiz_hasSeenWelcome'
            ];
            
            quizKeys.forEach(key => {
                if (localStorage.getItem(key)) {
                    localStorage.removeItem(key);
                    log(`✅ נמחק: ${key}`, 'success');
                }
            });
            
            log('✅ כל נתוני Quiz נמחקו!', 'success');
            updateQuizData();
        }

        function clearAll() {
            if (!confirm('האם אתה בטוח שברצונך למחוק את כל ה-localStorage?')) {
                return;
            }
            
            document.getElementById('results').innerHTML = '';
            log('מוחק את כל localStorage...', 'info');
            localStorage.clear();
            log('✅ כל הנתונים נמחקו!', 'success');
            updateQuizData();
        }

        function updateQuizData() {
            const quizDataDiv = document.getElementById('quizData');
            const quizKeys = [
                'quiz_score',
                'quiz_streak',
                'quiz_questionCount',
                'quiz_userData',
                'quiz_history',
                'quiz_categoryStats',
                'quiz_hasSeenWelcome'
            ];
            
            const data = {};
            quizKeys.forEach(key => {
                const value = localStorage.getItem(key);
                if (value) {
                    try {
                        data[key] = JSON.parse(value);
                    } catch {
                        data[key] = value;
                    }
                }
            });
            
            if (Object.keys(data).length === 0) {
                quizDataDiv.textContent = 'אין נתוני Quiz שמורים';
            } else {
                quizDataDiv.textContent = JSON.stringify(data, null, 2);
            }
        }

        // Initialize
        window.onload = function() {
            checkBrowserSupport();
            updateQuizData();
            
            // Auto-refresh quiz data every 2 seconds
            setInterval(updateQuizData, 2000);
        };
    </script>
</body>
</html>
